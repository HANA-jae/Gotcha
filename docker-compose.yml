version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gotcha-postgres
    environment:
      POSTGRES_DB: gotcha_db
      POSTGRES_USER: gotcha_user
      POSTGRES_PASSWORD: gotcha_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotcha_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gotcha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: gotcha-network
