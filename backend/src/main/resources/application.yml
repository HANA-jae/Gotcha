spring:
  application:
    name: gotcha

  web:
    cors:
      allowed-origins: http://localhost:5001
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      allow-credentials: true

# Server Configuration
server:
  port: 5000
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.picklab.gotcha: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
